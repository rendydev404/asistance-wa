services:
  web:
    build: .
    command: npm run start
    env_file: ${ENV_FILE:-.env}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    command: npm run bot
    env_file: ${ENV_FILE:-.env}
    volumes:
      - baileys_auth:/app/auth_info_baileys
    restart: unless-stopped

volumes:
  baileys_auth:
